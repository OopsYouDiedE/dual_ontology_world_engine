<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>动物园规则怪谈世界引擎 - C# WebAssembly 终端</title>
    <base href="./" />
    <style>
        body {
            background-color: #f5f5f7;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }
        .wasm-loader {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            gap: 16px;
        }
        .wasm-spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(0, 113, 227, 0.15);
            border-top-color: #0071e3;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="wasm-loader">
            <div class="wasm-spinner"></div>
            <div style="font-size: 15px; color: #1d1d1f; font-weight: 600;">Loading Dual-Ontology Engine...</div>
            <div style="font-size: 13px; color: #86868b;">Initial run downloads .NET 8 WebAssembly runtime</div>
        </div>
    </div>

    <div id="blazor-error-ui" style="display: none;">
        发生未处理的错误。
        <a href="" class="reload">重新加载</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
