<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>动物园规则怪谈世界引擎 - C# WebAssembly 终端</title>
    <base href="./" />
    <style>
        body {
            background-color: #0c1017;
            color: #c9d1d9;
            font-family: "Cascadia Code", Consolas, monospace;
            margin: 0;
            padding: 0;
        }
        .wasm-loader {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            gap: 16px;
        }
        .wasm-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(88, 166, 255, 0.2);
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="wasm-loader">
            <div class="wasm-spinner"></div>
            <div style="font-size: 14px; color: #58a6ff; font-weight: bold;">正在载入 Dual-Ontology C# WebAssembly 核心...</div>
            <div style="font-size: 12px; color: #8b949e;">首次加载正在下载 .NET 8 运行时与动物园模拟器程序集</div>
        </div>
    </div>

    <div id="blazor-error-ui" style="display: none;">
        发生未处理的错误。
        <a href="" class="reload">重新加载</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
