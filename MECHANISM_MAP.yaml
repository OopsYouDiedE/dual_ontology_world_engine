version: "2.1"
entry_points:
  godot_main: "scenes/main/Main.tscn"
  csharp_session_bridge: "scenes/main/SessionBridge.cs"
  cli_host: "core/session_cli/Program.cs"
  default_scenario: "assets/data/scenarios/campaign.dv"

mechanisms:
  dual_ontology_state:
    description: "物理客观域与角色主观心智域双本体状态隔离及跨主体访问拦截"
    dv_keywords: ["domain", "subject", "physical", "mind", "F_dv_cell"]
    csharp_authority:
      - "core/ontology/State.cs"
      - "core/ontology/References.cs"
    godot_presenters:
      - "scenes/main/SessionBridge.cs"
    verify_cmd: "none (no ontology check implemented; excluded from gate)"
    gate: "excluded"
    gate_reason: "--verify-ontology 尚无真实检查；当前 FAIL。经业主决定移出门禁，恢复前必须实现真实检查。"

  perception_and_erosion:
    description: "局部绑定投影、贝叶斯心智置信度聚合与源质侵蚀记忆周期截断"
    dv_keywords: ["F_dv_bind", "F_dv_perceive", "F_dv_aggregate", "F_dvs_erosion_update", "grants"]
    csharp_authority:
      - "core/cognition/Perception.cs"
      - "core/cognition/ActorCognition.cs"
    godot_presenters:
      - "scenes/components/characters/CampaignRoomHost.gd"
    verify_cmd: "none (no cognition check implemented; excluded from gate)"
    gate: "excluded"
    gate_reason: "--verify-cognition 尚无真实检查；当前 FAIL。经业主决定移出门禁，恢复前必须实现真实检查。"

  signed_horn_reasoning:
    description: "带符号霍恩逻辑、显式负证据与极小可信核心证明树校验"
    dv_keywords: ["theory", "proof", "negative", "hypothesis"]
    csharp_authority:
      - "core/reasoning/CaseTheory.cs"
      - "core/reasoning/CaseProofChecker.cs"
      - "core/reasoning/NaturalDeduction.cs"
    godot_presenters:
      - "scenes/components/characters/CampaignRoomHost.gd"
    workbench_tool: "tools/studio_web/proof_dag.html"
    verify_cmd: "python tools/story/author.py export --content assets/data/scenarios/campaign.dv --output .runtime/story/author-view.json"
    gate: "skipped_author_check"
    gate_reason: "作者检查步骤经业主决定跳过（tools/story/story-contract.json 缺失，属于作者内容）。"

  autonomy_drive_solver:
    description: "凹性满意度动机求解器与 Sim4 NPC 行为规划"
    dv_keywords: ["drive", "satisfaction", "routine", "scheme"]
    csharp_authority:
      - "core/autonomy/AutonomyDriveSolver.cs"
      - "core/autonomy/DriveCalculator.cs"
      - "core/autonomy/Sim4Planner.cs"
    godot_presenters:
      - "scenes/components/characters/AutonomousActorExecutor.gd"
      - "tools/sandbox/DebugOverlay3D.gd"
    workbench_tool: "tools/studio_web/timeline_gantt.html"
    verify_cmd: "dotnet run --project core/session_cli/DuelView.Cli.csproj -- --verify-drives"
    gate: "excluded"
    gate_reason: "--verify-drives 依赖缺失的 stage*-character-session.dv 与已删除 dv_core 生成的 stage7 包；经业主决定移出门禁。"

  causal_clock_and_campaign:
    description: "双轨流速因果时钟、7阶段单步切片流水线与五日战役跨日因果锁链"
    dv_keywords: ["campaign", "sleep_night", "wake", "content_time"]
    csharp_authority:
      - "core/simulation/SimulationClock.cs"
      - "core/simulation/RuntimeSession.cs"
      - "core/simulation/CampaignScenario.cs"
    godot_presenters:
      - "scenes/components/rendering/WorldTimeLighting.gd"
    verify_cmd: "dotnet run --project core/session_cli/DuelView.Cli.csproj -- --verify-character-actions"

  native_3d_architect_and_prefabs:
    description: "Godot 原生点击拖拽参数化建筑结构 (墙壁/栏杆/楼梯) 与已配好动作的智能预制件摆放"
    dv_keywords: ["portal", "room", "slot"]
    csharp_authority:
      - "core/spatial/PortalPolicy.cs"
      - "core/spatial/RoomLifecycle.cs"
      - "core/spatial/SeatingFit.cs"
      - "scenes/components/architecture/RoomStreamingController.cs"
      - "scenes/components/architecture/CutawayGeometry.cs"
    godot_presenters:
      - "scenes/components/architecture/SmartWall3D.gd"
      - "scenes/components/architecture/SmartRailing3D.gd"
      - "scenes/components/architecture/SmartStair3D.gd"
      - "scenes/components/architecture/SmartFloorZone3D.gd"
      - "scenes/components/architecture/RoomContainer3D.gd"
      - "scenes/components/architecture/PropEntity3D.gd"
    workbench_tool: "tools/godot_architect/PrefabPaletteDock.tscn"
    verify_cmd: "dotnet run --project core/session_cli/DuelView.Cli.csproj -- --verify-rooms"

  book_viewport_projection:
    description: "书本检视器：SubViewport 界面映射到书房 3D 对开页，切页即翻页"
    dv_keywords: ["casebook", "spread"]
    csharp_authority:
      - "scenes/main/CasebookPersistence.cs"
    godot_presenters:
      - "scenes/UIpanel/BookUI/BookUI.gd"
      - "scenes/components/world/StudyDeskStage3D.gd"
      - "assets/materials/book_leaf_mesh_3d.gdshader"
      - "assets/materials/book_spread_page.gdshader"
    verify_cmd: "none (legacy batch script removed from gate: depends on the retired .runtime/build layout)"
    gate: "excluded"
    gate_reason: "无当前有效检查；旧 verify_batch1.py 依赖已退役的 .runtime/build 布局与 S 系列任务，经整理移出门禁。"

  field_gui_presentation:
    description: "现场主控无底 GUI：时间与房间展示、任务执行进度、选中目标动作浮出与 3D 头顶跟随"
    dv_keywords: ["campaign", "interface", "action", "choice"]
    godot_presenters:
      - "scenes/main/Main.gd"
      - "scenes/UIpanel/GUI/FieldGUI.gd"
      - "scenes/UIpanel/GUI/ClockRoomGUI.gd"
      - "scenes/UIpanel/GUI/TaskProgressGUI.gd"
      - "scenes/UIpanel/GUI/ActionChoiceGUI.gd"
      - "scenes/components/characters/CampaignRoomHost.gd"
    verify_cmd: "dotnet build DualOntologyWorldReconstruct.csproj --nologo"

  persuasion_adoption_game:
    description: "说服 / 采纳博弈：对象把出示的证据与本人记忆逐条核对（佐证加分、矛盾减分），以个人参数独立决定；现场演出“权衡中→采纳/婉拒”"
    dv_keywords: ["suggestion", "opinion", "corroboration_weight", "contradiction_weight", "partial_evidence"]
    csharp_authority:
      - "core/simulation/WorldRules.cs"
    godot_presenters:
      - "scenes/components/characters/CampaignRoomHost.gd"
      - "scenes/components/characters/SimsBehaviorDirector.gd"
      - "scenes/UIpanel/GUI/PersuasionGUI.gd"
    verify_cmd: "python mcp/verification/cli_report.py run --steps 900"

  character_value_tuning:
    description: "角色数值自动优化流水线：extract → optimize（与 EvaluateSuggestion 一致的模型）→ validate（真实 CLI 对照）→ publish"
    dv_keywords: ["opinion", "values", "trust"]
    workbench_tool: "tools/tuning/character_tuning.py"
    verify_cmd: "python tools/tuning/character_tuning.py all --steps 500"

  field_sims_presentation:
    description: "Sims 式现场表现：空闲微行为、工作朝向、分离转向、开局黄金角螺旋分散、头顶活动气泡与选中菱形标记"
    godot_presenters:
      - "scenes/components/characters/SimsBehaviorDirector.gd"
      - "scenes/components/characters/CampaignRoomHost.gd"
      - "scenes/components/rendering/ObserverEnvironment3D.gd"
    verify_cmd: "python tools/ci/verify_ui_core_isolation.py"
