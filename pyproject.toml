[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-ontology-world-engine"
version = "0.1.0"
description = "A finite, auditable runtime for physical, semantic, and cognitive world state"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["dual_ontology_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
