<h1>Story · 宣传参考与当前实机</h1>
<p>2026-09-24。右侧截取真实运行窗口上方的场景区，排除对白区后比较。参考图是构图与美术目标，并非能直接执行的地图。原先人物高度约占场景7.5%，当前约11.2%；世界取景从1024×576收紧至640×384，通过2倍整数相机显示。</p>
<h2>01 / 中央厅清晨</h2><section>
<figure><div class="image reference"><img src="../theme-film/scenes/shot-01.png"></div><figcaption>宣传图 · 人物高度约12–14%</figcaption></figure>
<figure><div class="image game"><img src="CentralHall.png"></div><figcaption>实机 · 缩小钟与门廊，收紧地面，保留四门廊与真实可通行区域</figcaption></figure>
</section>
<h2>02 / 后勤院早餐</h2><section>
<figure><div class="image reference"><img src="../theme-film/scenes/shot-02.png"></div><figcaption>宣传图 · 主厨较近，约17%；桌边动作是独立制作要求</figcaption></figure>
<figure><div class="image game"><img src="Breakfast.png"></div><figcaption>实机 · 桌宽/人高由10.4降至6，人物集中在餐桌周围，两端可绕行</figcaption></figure>
</section>
<h2>03 / 公共娱乐室围谈</h2><section>
<figure><div class="image reference"><img src="../theme-film/scenes/shot-03.png"></div><figcaption>宣传图 · 石壁炉、暗红软椅、较集中的围谈关系</figcaption></figure>
<figure><div class="image game"><img src="ParlorGathering.png"></div><figcaption>实机 · 新石壁炉与暗红软椅，坐姿朝向中心，替换强烈拼花地面</figcaption></figure>
</section>
<p><strong>剩余差距：</strong>早餐尚无参考图的盛餐演技，人物细节与部分配件仍未达到宣传图品质。本轮贴图包含生成源稿的缩放派生，不声称为原生逐像素重绘。<a href="../../godot_csharp/scenes/Story/README.md">比例说明、操作与验证记录</a>。</p>
