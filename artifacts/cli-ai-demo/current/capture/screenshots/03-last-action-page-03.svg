<text x="20" y="55" textLength="800" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">回放 2425/2598 · 1× · 暂停 · 自主  ·  第1日 09:21  ·  视角 侦探  ·  帧内：已执行</text>
<text x="1050" y="55" textLength="30" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">3/4</text>
<text x="20" y="75" textLength="610" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">推进 456.945 游戏小时/现实小时  ·  决策 63633.849 次/现实小时</text>
<text x="20" y="95" textLength="640" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">引擎接口 0.765 小时/现实小时  ·  采样 10.636 秒 / 推进 81 游戏分</text>
<text x="20" y="135" textLength="80" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">较早记录</text>
<text x="20" y="155" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="700" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">第1日 08:39 · 侦探</text>
<text x="20" y="175" textLength="320" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">灰上有一枚马球靴印，踩得很清楚。</text>
<text x="20" y="195" textLength="200" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">鞋尖朝着门侧的插闩。</text>
<text x="20" y="215" textLength="240" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">鞋跟一端被什么东西压过。</text>
<text x="20" y="255" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="700" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">第1日 08:38 · 侦探</text>
<text x="20" y="275" textLength="540" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">门内地面铺着一片扇形的灰，窄端贴着门缝，向门厅里散开。</text>
<text x="20" y="295" textLength="600" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">东南墙角躺着一枚木楔：上面一层灰，底面干净。楔尖有新的磨痕。</text>
<text x="20" y="315" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">门底边有一道擦痕。</text>
<text x="20" y="355" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="700" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">第1日 08:37 · 侦探</text>
<text x="20" y="375" textLength="240" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">门内侧的插闩落在闩槽里。</text>
<text x="20" y="395" textLength="360" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">门外侧另有一道横闩，从这一侧拉不动。</text>
<text x="20" y="415" textLength="440" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">门上的猫眼，玻璃外侧糊满烟灰，看出去一片黑。</text>
<text x="20" y="435" textLength="760" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">门内侧压着一张泛黄的旧纸，题头是铅印的《事故隔离规程》，没有署名和落款日期。</text>
<text x="20" y="455" textLength="940" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">旧纸写着：泄漏后，各寝区的隔离门从外侧落闩。查明本区事故经过，由当值者向铜口陈述前，不得开启。</text>
<text x="20" y="475" textLength="340" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">末行另写：急病者可经铜口呼叫转移。</text>
<text x="20" y="515" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="700" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">第1日 08:36 · 侦探</text>
<text x="20" y="535" textLength="280" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">查看门内的插闩和门外的横闩。</text>
<text x="20" y="575" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="700" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">第1日 08:35 · 侦探</text>
<text x="20" y="595" textLength="190" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">已抵达乙区 · 门厅。</text>
<text x="20" y="635" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="700" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">第1日 08:33 · 侦探</text>
<text x="20" y="655" textLength="560" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">声路试验完成。各处听见了什么，还需分别询问实际在场的人。</text>
<text x="20" y="695" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="700" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">第1日 08:12 · 沈鼎</text>
<text x="20" y="715" textLength="140" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">嗯？……顺手吧。</text>
<text x="20" y="755" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="700" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">第1日 08:11 · 苏泠</text>
<text x="20" y="775" textLength="260" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">……你怎么知道我喝茶不放糖？</text>
<text x="20" y="815" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="700" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">第1日 08:11 · 沈鼎</text>
<text x="20" y="835" textLength="580" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">都还记得啥？我就记得上船。下了跳板往后，脑子里白茫茫一片。</text>
<text x="20" y="875" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="700" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">第1日 08:10 · 沈鼎</text>
<text x="20" y="895" textLength="540" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">他把茶一杯一杯推过来。推到苏泠面前的那杯，他没有放糖。</text>
<text x="20" y="935" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="700" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">第1日 08:09 · 沈鼎</text>
<text x="20" y="955" textLength="220" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">我姓沈，沈鼎，烧菜的。</text>
</svg>
