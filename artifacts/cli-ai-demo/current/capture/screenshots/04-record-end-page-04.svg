<text x="1050" y="55" textLength="30" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">4/4</text>
<text x="20" y="75" textLength="600" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">推进 387.51 游戏小时/现实小时  ·  决策 46745.949 次/现实小时</text>
<text x="20" y="95" textLength="630" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">引擎接口 0.74 小时/现实小时  ·  采样 14.709 秒 / 推进 95 游戏分</text>
<text x="20" y="135" textLength="80" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">较早记录</text>
<text x="20" y="155" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="700" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">第1日 08:12 · 沈鼎</text>
<text x="20" y="175" textLength="140" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">嗯？……顺手吧。</text>
<text x="20" y="215" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="700" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">第1日 08:11 · 苏泠</text>
<text x="20" y="235" textLength="260" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">……你怎么知道我喝茶不放糖？</text>
<text x="20" y="275" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="700" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">第1日 08:11 · 沈鼎</text>
<text x="20" y="295" textLength="580" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">都还记得啥？我就记得上船。下了跳板往后，脑子里白茫茫一片。</text>
<text x="20" y="335" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="700" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">第1日 08:10 · 沈鼎</text>
<text x="20" y="355" textLength="540" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">他把茶一杯一杯推过来。推到苏泠面前的那杯，他没有放糖。</text>
<text x="20" y="395" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="700" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">第1日 08:09 · 沈鼎</text>
<text x="20" y="415" textLength="220" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">我姓沈，沈鼎，烧菜的。</text>
<text x="20" y="455" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="700" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">第1日 08:09 · 侦探</text>
<text x="20" y="475" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">侦探。……做侦探的。</text>
<text x="20" y="515" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="700" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">第1日 08:08 · 同伴</text>
<text x="20" y="535" textLength="320" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">哟，又醒一个。进来坐，茶刚泡上。</text>
