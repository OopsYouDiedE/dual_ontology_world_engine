<text x="20" y="95" textLength="640" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">引擎接口 0.765 小时/现实小时  ·  采样 10.636 秒 / 推进 81 游戏分</text>
<text x="20" y="135" textLength="80" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">较早记录</text>
<text x="20" y="155" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="700" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">第1日 08:09 · 侦探</text>
<text x="20" y="175" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">侦探。……做侦探的。</text>
<text x="20" y="215" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="700" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">第1日 08:08 · 同伴</text>
<text x="20" y="235" textLength="320" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">哟，又醒一个。进来坐，茶刚泡上。</text>
<text x="20" y="275" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="700" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">第1日 08:08 · 侦探</text>
<text x="20" y="295" textLength="470" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">铜口嵌在活动厅北墙上，下方铜牌刻着一个符号：◎。</text>
<text x="20" y="315" textLength="1050" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">一根铜管从铜口后面出来：一路沿北墙向西，穿墙进门厅，贴着墙下到隔离门的门框；另一路向东，钻进活动厅与 R-08</text>
<text x="20" y="335" textLength="120" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">之间的墙里。</text>
<text x="20" y="355" textLength="560" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">那道墙上与门框北侧各有一个管接头，一碰就晃——接口松了。</text>
<text x="20" y="395" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="700" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">第1日 08:07 · 苏泠</text>
<text x="20" y="415" textLength="140" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">苏泠。弹琴的。</text>
<text x="20" y="455" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="700" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">第1日 08:07 · 霍铎</text>
<text x="20" y="475" textLength="140" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">……霍铎。钳工。</text>
<text x="20" y="515" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="700" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">第1日 08:07 · 侦探</text>
<text x="20" y="535" textLength="260" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">一块小石板，粉笔速记两行。</text>
<text x="20" y="555" textLength="230" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">第一行：主楼：⊥门 ✕开 ◎</text>
<text x="20" y="575" textLength="420" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">第二行：一个小小的放大镜图样，后面是“⊥✓”。</text>
