<text x="20" y="495" textLength="40" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">侦探</text>
<text x="20" y="515" textLength="280" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">我记得的最后一件事，是上船。</text>
<text x="20" y="535" textLength="720" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">衣架上挂着一件风衣。右手袖口磨得发亮——我写字时总拿那儿蹭桌沿。是我的。</text>
<text x="20" y="555" textLength="260" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">先出去，看看这是什么地方。</text>
<text x="20" y="595" textLength="40" lengthAdjust="spacingAndGlyphs" fill="#93a8bb" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">侦探</text>
<text x="20" y="615" textLength="480" lengthAdjust="spacingAndGlyphs" fill="#eadfca" font-size="16" font-weight="400" font-family="Cascadia Mono, Noto Sans Mono CJK SC, Microsoft YaHei, monospace" xml:space="preserve">你披上了这件熟悉的呢料风衣，领口与袖口早已磨平。</text>
