<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1250"><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#25372c}.s{font-size:14px}.t{font-size:28px;font-weight:bold}</style><rect width="1700" height="1250" fill="#f7f2e8"/><text x="50" y="45" class="t">主楼 B2 · 同坐标剖切轴测候选</text><text x="50" y="80">完成面+40.6m / 层间4.2m；墙体在1.2m处截断示意，非实际墙高</text><polygon points="572,190.5 884,307.5 788,373.5 476,256.5" fill="#e2dacb" stroke="#676052"/><polygon points="572,190.5 788,271.5 788,235.5 572,154.5" fill="#c9bea7" stroke="#676052"/><polygon points="572,190.5 500,240 500,204 572,154.5" fill="#ded2b8" stroke="#676052"/><polygon points="572,190.5 788,271.5 716,321 500,240" fill="#d2b89b" stroke="#676052"/><text x="644" y="255.75" text-anchor="middle" font-size="11">B201</text><polygon points="500,240 812,357 812,321 500,204" fill="#c9bea7" stroke="#676052"/><polygon points="500,240 476,256.5 476,220.5 500,204" fill="#ded2b8" stroke="#676052"/><polygon points="500,240 812,357 788,373.5 476,256.5" fill="#e6eddd" stroke="#676052"/><text x="644" y="306.75" text-anchor="middle" font-size="11">B202</text><polygon points="804,311.5 852,329.5 852,293.5 804,275.5" fill="#c9bea7" stroke="#676052"/><polygon points="804,311.5 764,339 764,303 804,275.5" fill="#ded2b8" stroke="#676052"/><polygon points="804,311.5 852,329.5 812,357 764,339" fill="#e6be91" stroke="#676052"/><text x="808" y="334.25" text-anchor="middle" font-size="11">SB</text><text x="50" y="1020">剖切轴测仅解释房间相对位置；门窗精确开口见同层平面及门表，未把色块当实体施工图。</text><text x="50" y="1060">四锚只保留功能待重建；本设备局部不分配锚点/线索/路线。</text><text x="50" y="1100">S1 x17..23；S2 x24..28；S3 x35..39；T x26.5..33.5 同位叠置。</text><text x="50" y="1140">M1 5×8m双跑候选（1F到2F）；地下SB 4×5m（B2到B1）。未授予通过权限。</text></svg>