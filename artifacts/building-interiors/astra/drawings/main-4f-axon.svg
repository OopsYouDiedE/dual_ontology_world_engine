<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1250"><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#25372c}.s{font-size:14px}.t{font-size:28px;font-weight:bold}</style><rect width="1700" height="1250" fill="#f7f2e8"/><text x="50" y="45" class="t">主楼 4F · 同坐标剖切轴测候选</text><text x="50" y="80">完成面+66m / 层间4.8m；墙体在1.2m处截断示意，非实际墙高</text><polygon points="468,466 684,547 604,602 388,521" fill="#e2dacb" stroke="#676052"/><polygon points="782,447.75 866,479.25 802,523.25 718,491.75" fill="#e2dacb" stroke="#676052"/><polygon points="782,447.75 866,479.25 866,443.25 782,411.75" fill="#c9bea7" stroke="#676052"/><polygon points="782,447.75 718,491.75 718,455.75 782,411.75" fill="#ded2b8" stroke="#676052"/><polygon points="782,447.75 866,479.25 802,523.25 718,491.75" fill="#b7b5af" stroke="#676052"/><text x="792" y="485.5" text-anchor="middle" font-size="11">T</text><polygon points="468,466 540,493 540,457 468,430" fill="#c9bea7" stroke="#676052"/><polygon points="468,466 388,521 388,485 468,430" fill="#ded2b8" stroke="#676052"/><polygon points="468,466 540,493 460,548 388,521" fill="#d4bd9b" stroke="#676052"/><text x="464" y="507" text-anchor="middle" font-size="11">A401</text><polygon points="524,504 596,531 596,495 524,468" fill="#c9bea7" stroke="#676052"/><polygon points="524,504 460,548 460,512 524,468" fill="#ded2b8" stroke="#676052"/><polygon points="524,504 596,531 532,575 460,548" fill="#e6be91" stroke="#676052"/><text x="528" y="539.5" text-anchor="middle" font-size="11">S1</text><polygon points="612,520 684,547 684,511 612,484" fill="#c9bea7" stroke="#676052"/><polygon points="612,520 532,575 532,539 612,484" fill="#ded2b8" stroke="#676052"/><polygon points="612,520 684,547 604,602 532,575" fill="#d4bd9b" stroke="#676052"/><text x="608" y="561" text-anchor="middle" font-size="11">A402</text><text x="50" y="1020">剖切轴测仅解释房间相对位置；门窗精确开口见同层平面及门表，未把色块当实体施工图。</text><text x="50" y="1060">局部名录库下为北翼实体；钟楼核贯穿中联实体，不压庭院/书库。</text><text x="50" y="1100">S1 x17..23；S2 x24..28；S3 x35..39；T x26.5..33.5 同位叠置。</text><text x="50" y="1140">M1 5×8m双跑候选（1F到2F）；地下SB 4×5m（B2到B1）。未授予通过权限。</text></svg>