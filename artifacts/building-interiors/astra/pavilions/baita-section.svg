41" text-anchor="middle">板下约3.95m</text><text x="70.0" y="150.0" font-size="16" fill="#263541" text-anchor="start">纵向空间剖示：8.8m房带 + 2.4m公共廊 + 8.8m房带；右侧留尺寸说明栏（非额外面积）。</text><text x="70.0" y="190.0" font-size="16" fill="#263541" text-anchor="start">楼梯每层展开：两跑各12级；175mm踢面；11×280mm踏面/跑；平台1.50m。</text><g transform="translate(940,120) scale(.70)"><path d="M 85,300 v -7.874999999999999 h 12.600000000000001 v -7.874999999999999 h 12.600000000000001 v -7.874999999999999 h 12.600000000000001 v -7.874999999999999 h 12.600000000000001 v -7.874999999999999 h 12.600000000000001 v -7.874999999999999 h 12.600000000000001 v -7.874999999999999 h 12.600000000000001 v -7.874999999999999 h 12.600000000000001 v -7.874999999999999 h 12.600000000000001 v -7.874999999999999 h 12.600000000000001 v -7.874999999999999 h 12.600000000000001 v -7.874999999999999 h 67.5 v -7.874999999999999 h 12.600000000000001 v -7.874999999999999 h 12.600000000000001 v -7.874999999999999 h 12.600000000000001 v -7.874999999999999 h 12.600000000000001 v -7.874999999999999 h 12.600000000000001 v -7.874999999999999 h 12.600000000000001 v -7.874999999999999 h 12.600000000000001 v -7.874999999999999 h 12.600000000000001 v -7.874999999999999 h 12.600000000000001 v -7.874999999999999 h 12.600000000000001 v -7.874999999999999 h 12.600000000000001 v -7.874999999999999 h 67.5" fill="none" stroke="#526c76" stroke-width="4"/></g><text x="1060.0" y="370.0" font-size="16" fill="#263541" text-anchor="start">U形两跑（上图展开）</text><text x="1060.0" y="398.0" font-size="15" fill="#263541" text-anchor="start">净跑宽1.40m</text><text x="1060.0" y="426.0" font-size="15" fill="#263541" text-anchor="start">两跑间隙0.20m</text><text x="1060.0" y="454.0" font-size="15" fill="#263541" text-anchor="start">每跑水平长3.08m</text><text x="1060.0" y="482.0" font-size="15" fill="#263541" text-anchor="start">候选洞口3.40×4.80m</text><text x="1060.0" y="510.0" font-size="15" fill="#263541" text-anchor="start">S1、S2每层同坐标</text><text x="70.0" y="840.0" font-size="17" fill="#263541" text-anchor="start">楼板在两个楼梯间的指定洞口范围断开；洞口位置与平面中的楼梯成组对应。</text><text x="70.0" y="874.0" font-size="17" fill="#263541" text-anchor="start">楼梯空间为独立公共交通，不以任何实验室、诊疗室或档案室作为过路房。</text><text x="70.0" y="908.0" font-size="17" fill="#263541" text-anchor="start">纵剖仅表达层次与交通原则；梁深、扶手、实际净空、防火分区与无障碍方案尚未核定。</text><text x="70.0" y="942.0" font-size="17" fill="#263541" text-anchor="start">主楼桥接标高/馆端高差未定；地下勤务连接仅需求，不据此图新增地下层或密道。</text></svg>