<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>48px 旗帜动画检查</title><style>body{margin:28px;background:#16191f;color:#e7e2d6;font:16px system-ui}h1{font-size:22px}canvas{image-rendering:pixelated;width:960px;max-width:100%;height:auto;border:1px solid #424850}button,label{margin-right:12px}button{padding:7px 14px}p{color:#b6bcc7}</style><h1>五方旗帜 · 48px 动画</h1><p>皇室团龙 / 皇家科学院 / 神秘学公会 / 学院 / 伯爵个人</p><canvas id="view" width="240" height="192"></canvas><p>上排 48×96 · 8帧轻摆 · 6fps　中排 48×48 · 8帧飘扬 · 10fps　下排 48×48 静态纹样</p><button id="play">暂停</button><button id="step">下一帧</button><label><input id="grid" type="checkbox" checked>48px 网格</label><span id="phase"></span><script>const c=document.querySelector('canvas'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;let elapsed=0,last=0,running=true;const imgs=['../图集/长旗_五方八帧.png','../图集/横旗_五方八帧.png','../图集/纹样_五方.png'].map(src=>{const im=new Image;im.src=src;return im});function paint(){if(!imgs.every(im=>im.complete&&im.naturalWidth))return;ctx.fillStyle='#22272f';ctx.fillRect(0,0,240,192);const a=Math.floor(elapsed*6)%8,b=Math.floor(elapsed*10)%8;for(let i=0;i<5;i++){ctx.drawImage(imgs[0],a*48,i*96,48,96,i*48,0,48,96);ctx.drawImage(imgs[1],b*48,i*48,48,48,i*48,96,48,48)}ctx.drawImage(imgs[2],0,144);if(document.querySelector('#grid').checked){ctx.strokeStyle='#8795aa55';ctx.lineWidth=.3;ctx.beginPath();for(let x=0;x<=240;x+=48){ctx.moveTo(x,0);ctx.lineTo(x,192)}for(let y=0;y<=192;y+=48){ctx.moveTo(0,y);ctx.lineTo(240,y)}ctx.stroke()}document.querySelector('#phase').textContent='长旗帧 '+a+' / 横旗帧 '+b}function tick(now){if(last&&running)elapsed+=(now-last)/1000;last=now;paint();requestAnimationFrame(tick)}requestAnimationFrame(tick);document.querySelector('#play').onclick=()=>{running=!running;document.querySelector('#play').textContent=running?'暂停':'播放'};document.querySelector('#step').onclick=()=>{running=false;document.querySelector('#play').textContent='播放';elapsed+=.1;paint()};</script></html>
