<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>冬日荒野 · 雪地营地</title><meta name="description" content="固定视角的手绘雪地场景。操控威尔逊，与自主行动的温蒂一起采集。"><link rel="stylesheet" href="winter.css"></head>
<body>
<header class="masthead"><div class="title"><span class="snowflake">✳</span><div><h1>冬日荒野</h1><span>THE CONSTANT — WINTER CAMP</span></div></div><div class="season"><span class="day">21<small>DAY</small></span><span class="season-label">隆冬 <i>／</i> 雪地营地</span></div><div class="header-actions"><button id="pause" aria-label="暂停游戏" aria-pressed="false">Ⅱ <span>暂停</span></button><button id="fullscreen" aria-label="全屏显示">⛶</button></div></header>
<main id="gameFrame" tabindex="0" aria-label="雪地游戏场景，WASD或方向键移动威尔逊，按住空格采集">
<canvas id="game" aria-label="固定视角雪地营地，威尔逊和温蒂的四向动画"></canvas>
<div class="scene-tag"><span class="live-dot"></span>固定视角<span class="slash">/</span><span>玩家 + 自主伙伴</span></div>
<div class="supplies"><span class="supplies-title">营地物资</span><div><span>木料 <b id="woodCount">0</b></span><i></i><span>冰晶 <b id="iceCount">0</b></span><i></i><span>石料 <b id="stoneCount">0</b></span></div></div>
<div class="loading" id="loading"><span class="loading-mark">✳</span><h2>正在进入雪地</h2><p>准备角色与营地…</p></div>
<div class="pause-overlay" id="pauseOverlay" hidden><span>Ⅱ</span><h2>风雪暂歇</h2><button id="resume">继续探索</button></div>
<div class="event-log" id="eventLog" aria-live="polite">温蒂正在寻找可以采集的物资。</div>
<div class="interaction" id="interaction"><kbd>SPACE</kbd><span id="interactionText">靠近标记处，按住空格采集</span></div>
<div class="touch-controls"><div class="dpad"><button data-move="up" aria-label="向上">↑</button><button data-move="left" aria-label="向左">←</button><button data-move="down" aria-label="向下">↓</button><button data-move="right" aria-label="向右">→</button></div><button id="touchWork" aria-label="采集">采集</button></div>
</main>
<footer class="toolbar"><div class="character-card player"><div class="portrait" id="wilsonPortrait"></div><div><span class="character-role">PLAYER 01</span><h2>威尔逊 <small id="playerState">待命</small></h2></div></div><div class="character-card companion"><div class="portrait" id="wendyPortrait"></div><div><span class="character-role">COMPANION · AI</span><h2>温蒂 <small id="aiState">寻找物资</small></h2></div></div><div class="instructions"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / 方向键移动</span><span><kbd>SPACE</kbd> 按住采集 <i>·</i> <kbd>P</kbd> 暂停</span></div><button id="restart" class="restart">↺<span>重置营地</span></button></footer>
<script src="winter.js"></script>
</body></html>
