<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>不可知之约 · 五幕机制演示</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><a class="brand" href="../index.html">◈ <span>不可知之约<small>THE UNKNOWING PACT</small></span></a><span class="edition">机制剧场 / 手绘动作演示</span><button id="music" aria-pressed="false">♫ 开启配乐</button></header>
<main>
 <nav id="scenes" aria-label="选择演示场景"></nav>
 <section class="theatre">
  <div class="stage" id="stage"><canvas id="world" width="1200" height="800" tabindex="0" aria-label="场景画面；WASD 或方向键八向移动，点击地面行走"></canvas><div class="stage-top"><span id="layer">主观世界</span><span id="frame">手绘 SPRITE · 3 + 1</span></div><div id="speech" role="status"></div><div class="caption"><span id="stage-label">第一幕 / 言灵发动</span><span id="loading">正在装入手绘素材…</span></div></div>
  <aside><div class="chapter" id="chapter">ACT I</div><h1 id="title">言灵发动</h1><p id="intro" class="intro"></p><div class="divider">◈</div><div class="status"><span id="meter-label">现实辨识</span><strong id="meter-value">0%</strong></div><div class="meter"><i id="meter"></i></div><p id="note" aria-live="polite"></p><div id="controls"></div><section class="record"><h2>现场记录</h2><p id="record" aria-live="polite"></p></section><button id="reset" class="quiet">↻ 重演本幕</button></aside>
 </section>
 <footer><span><kbd>W A S D</kbd> / <kbd>↑ ↓ ← →</kbd> 八向移动 · 点击地面行走</span><span>三帧动作 + 一帧停顿 <b>·</b> <button id="pause">暂停画面</button> <button id="next-frame" disabled>单步一帧</button></span></footer>
 <p class="scope">可交互美术演示 · 言灵与世界状态为本地场景脚本，尚未接入 C# Core。</p>
</main><script src="app.js"></script>
</body></html>
