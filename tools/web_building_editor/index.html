      const l = getActiveLayer();
      if (l) {
        l.style = style;
        l.rebuildVisuals();
        saveHistorySnapshot();
      }
    }

    function renderLayerUI() {
      const container = document.getElementById('layer-list');
      if (!container) return;
      container.innerHTML = '';
      for (const l of floorLayers) {
        const div = document.createElement('div');
        div.className = `px-2 py-1.5 rounded border text-[11px] flex items-center justify-between cursor-pointer transition ${l.id === activeLayerId ? 'bg-[#222631] border-[#caa15a] text-white font-medium' : 'bg-[#101217] border-[#1f232d] text-[#7f8798] hover:border-[#323847]'}`;
        div.innerHTML = `<span>${l.name}</span><span class="text-[10px] text-[#caa15a] font-mono">${l.y.toFixed(1)}m</span>`;
        div.onclick = () => {
          activeLayerId = l.id;
          document.getElementById('layer-height-input').value = l.y;
          document.getElementById('floor-style-select').value = l.style;
          if (document.getElementById('wall-auto-layer-y')?.checked) {
            syncLiveWallDrawParams('y', l.y);
          }
          renderLayerUI();
        };
        container.appendChild(div);
      }
    }

    /* =========================================================================
       7. 墙体、立柱与门窗构建系统 (修正墙体顶部与转角面重叠 Z-Fighting)
       ========================================================================= */
    function onToggleAutoWallY() {
      const auto = document.getElementById('wall-auto-layer-y')?.checked;
      if (auto) {
        const l = getActiveLayer();
        if (l) syncLiveWallDrawParams('y', l.y);
      }
    }

    function syncLiveWallDrawParams(field, val) {
      const num = parseFloat(val);
      if (field === 'y' && !isNaN(num)) {
        const el1 = document.getElementById('wall-basey-val');
        const el2 = document.getElementById('live-wall-y');
        if (el1) el1.value = num;
        if (el2) el2.value = num;
        // 实时同步正在放线的墙体节点高度
        for (const pt of currentDrawingPoints) {
          pt[2] = num;
        }
      } else if (field === 'h' && !isNaN(num)) {
        const el1 = document.getElementById('wall-h-val');
        const el2 = document.getElementById('live-wall-h');
        if (el1) el1.value = num;
        if (el2) el2.value = num;
      } else if (field === 't' && !isNaN(num)) {
        const el1 = document.getElementById('wall-t-val');
        const el2 = document.getElementById('live-wall-t');
        if (el1) el1.value = num;
        if (el2) el2.value = num;
      }
    }

    function autoBuildWallFromActiveFloor(withDefaultOpenings = false) {
      const layer = getActiveLayer();
      if (!layer || !layer.polygons.length) return showToast('当前图层没有地板多边形');
      const height = Number(document.getElementById('wall-h-val').value);
      const thickness = Number(document.getElementById('wall-t-val').value);
      const outset = Number(document.getElementById('wall-outset-val').value);
      if (!Number.isFinite(height) || height < 0.5 || height > 10 ||
          !Number.isFinite(thickness) || thickness < 0.05 || thickness > 1 ||
          !Number.isFinite(outset) || outset < 0 || outset > 4) {
        return showToast('墙高、墙厚或外扩距离无效');
      }
      const generated = [];
      for (const polygon of layer.polygons) {
        const floor = polygon.slice();
        if (floor.length > 3 && Math.hypot(floor[0][0] - floor.at(-1)[0], floor[0][1] - floor.at(-1)[1]) < 0.001) floor.pop();
        if (floor.length < 3 || Math.abs(MeshKit.signedArea2D(floor)) < 0.01) continue;
        const ring = MeshKit.offsetPolygon2D(floor, outset);
        if (ring.length < 3 || ring.some(p => !p.every(Number.isFinite))) return showToast('地板多边形无法外扩');
        const points = ring.map(([x, z]) => [x, layer.y, z]);
        points.push([...points[0]]);
        const openings = withDefaultOpenings && generated.length === 0 && ring.length === 4 ? [
          { id: uid('op'), segment: 3, center: 3, width: 1.8, height: 2.5, bottom: 0, rise: 0.4, type: 'double_door' },
          { id: uid('op'), segment: 1, center: 2.6, width: 1.4, height: 2.3, bottom: 0.85, rise: 0.4, type: 'arched_window' },
          { id: uid('op'), segment: 1, center: 5.4, width: 1.4, height: 2.3, bottom: 0.85, rise: 0.4, type: 'arched_window' }
        ] : [];
        generated.push({ id: uid('wall'), name: `自动外墙 · ${layer.name} · ${generated.length + 1}`,
          generatedLayerId: layer.id, points, closed: true, height, thickness, baseY: layer.y,
          style: document.getElementById('wall-style-select').value,
          hasPillars: document.getElementById('wall-has-pillars')?.checked ?? true, openings });
      }
      if (!generated.length) return showToast('当前图层没有有效的地板多边形');
      // Replace only this layer's generated walls; hand-drawn and other floors survive.
      wallPaths = wallPaths.filter(w => w.generatedLayerId !== layer.id);
      wallPaths.push(...generated);
      selectedItem = null;
      rebuildAll3D();
      updateInspectorUI();
      updateSceneOutlineUI();
      saveHistorySnapshot();
      if (!withDefaultOpenings) showToast(`已生成 ${generated.length} 圈外墙（外扩 ${outset}m）`);
    }

    function buildSingleWall3D(wallObj) {
      const { points: points3D, height, thickness, baseY = 0, style = 'classical', hasPillars = true, openings = [] } = wallObj;
      const pathGroup = new THREE.Group();
      wall3DGroup.add(pathGroup);

      const wallMat = (style === 'stone') ? MATERIALS.stone : MATERIALS.wall;
      const halfT = thickness * 0.5;
      const totalSegs = points3D.length - 1;

      // 修正墙体顶部面重叠 (Z-Fighting)：
      // 1. 当转角存在立柱或相邻墙段相连时，墙段首尾向内收缩 trimInset，避免两个墙段在转角处的顶面、底面、顶线(cornice)与立柱内部发生共面重叠；
      // 2. 当 style === 'classical' 带有顶线(cornice)时，顶线顶面设为 height + 0.002，或墙体实心段顶面低于顶线顶面，彻底消除顶线与墙顶共面闪烁。
      for (let i = 0; i < totalSegs; i++) {
        const p0 = points3D[i], p1 = points3D[i + 1];
        const dx = p1[0] - p0[0], dz = p1[2] - p0[2];
        const len = Math.hypot(dx, dz);
        if (len < 0.01) continue;

        const segBaseY = (p0[1] !== undefined) ? p0[1] : baseY;
        const hasStartJoin = wallObj.closed || i > 0 || hasPillars;
        const hasEndJoin = wallObj.closed || i < totalSegs - 1 || hasPillars;
        const startTrim = hasStartJoin ? Math.min(len * 0.25, hasPillars ? thickness * 0.52 : thickness * 0.48) : 0.0;
        const endTrim = hasEndJoin ? Math.min(len * 0.25, hasPillars ? thickness * 0.52 : thickness * 0.48) : 0.0;
        const xMin = startTrim;
        const xMax = Math.max(xMin + 0.01, len - endTrim);

        const segOpenings = (openings || []).filter(o => o.segment === i);
        const segGroup = new THREE.Group();

        const xSet = [xMin, xMax];
        for (const o of segOpenings) {
          xSet.push(Math.max(xMin, o.center - o.width * 0.5), Math.min(xMax, o.center + o.width * 0.5));
        }
        xSet.sort((a, b) => a - b);
        const xs = [];
        for (const v of xSet) {
          if (xs.length === 0 || Math.abs(v - xs[xs.length - 1]) > 0.001) xs.push(v);
        }

        const pos = [], norm = [];
        function addQuad(v0, v1, v2, v3) {
          const n = new THREE.Vector3().crossVectors(new THREE.Vector3().subVectors(v1, v0), new THREE.Vector3().subVectors(v2, v0)).normalize();
          pos.push(v0.x, v0.y, v0.z, v1.x, v1.y, v1.z, v2.x, v2.y, v2.z);
          norm.push(n.x, n.y, n.z, n.x, n.y, n.z, n.x, n.y, n.z);
          pos.push(v0.x, v0.y, v0.z, v2.x, v2.y, v2.z, v3.x, v3.y, v3.z);
          norm.push(n.x, n.y, n.z, n.x, n.y, n.z, n.x, n.y, n.z);
        }

        for (let j = 0; j < xs.length - 1; j++) {
          const x0 = xs[j], x1 = xs[j + 1];
          const segW = x1 - x0;
          if (segW < 0.002) continue;
          const xm = (x0 + x1) * 0.5;
          const activeHoles = segOpenings.filter(o => (o.center - o.width * 0.5 <= xm && xm <= o.center + o.width * 0.5));
          let cursor = 0.0;
          const gaps = [];
          activeHoles.sort((a, b) => a.bottom - b.bottom);
          for (const o of activeHoles) {
            if (o.bottom > cursor + 0.001) gaps.push([cursor, o.bottom]);
            cursor = Math.max(cursor, o.bottom + o.height);
          }
          if (height > cursor + 0.001) gaps.push([cursor, height]);

          for (const g of gaps) {
            const y0 = g[0];
            // 若顶部带有古典顶线 cornice，主墙体顶面下沉至 height - 0.12，由顶线完全接管顶部，彻底消除顶面共面重叠！
            const hasTopCornice = (style === 'classical') && (g[1] >= height - 0.01) && ((g[1] - y0) >= 0.16);
            const y1 = hasTopCornice ? (height - 0.12) : g[1];

            addQuad(new THREE.Vector3(x0, y0, halfT), new THREE.Vector3(x1, y0, halfT), new THREE.Vector3(x1, y1, halfT), new THREE.Vector3(x0, y1, halfT));
            addQuad(new THREE.Vector3(x1, y0, -halfT), new THREE.Vector3(x0, y0, -halfT), new THREE.Vector3(x0, y1, -halfT), new THREE.Vector3(x1, y1, -halfT));
            if (!hasTopCornice) {
              addQuad(new THREE.Vector3(x0, y1, halfT), new THREE.Vector3(x1, y1, halfT), new THREE.Vector3(x1, y1, -halfT), new THREE.Vector3(x0, y1, -halfT));
            }
            addQuad(new THREE.Vector3(x0, y0, -halfT), new THREE.Vector3(x1, y0, -halfT), new THREE.Vector3(x1, y0, halfT), new THREE.Vector3(x0, y0, halfT));

            // 沿无洞口的实墙段切分生成踢脚线、腰线与顶线
            if (style === 'classical' || style === 'dado') {
              if (y0 <= 0.01 && g[1] >= 0.17) {
                const skirt = new THREE.Mesh(MeshKit.createBoxGeometry(segW, 0.17, thickness + 0.04), MATERIALS.wood_dark);
                skirt.position.set(xm, 0.085, 0);
                segGroup.add(skirt);
              }
              if (y0 <= 1.01 && g[1] >= 1.09) {
                const dado = new THREE.Mesh(MeshKit.createBoxGeometry(segW, 0.08, thickness + 0.05), MATERIALS.wood_dark);
                dado.position.set(xm, 1.05, 0);
                segGroup.add(dado);
              }
              if (hasTopCornice) {
                const cornice = new THREE.Mesh(MeshKit.createBoxGeometry(segW, 0.12, thickness + 0.06), MATERIALS.wood_dark);
                cornice.position.set(xm, height - 0.06, 0);
                cornice.castShadow = true;
                segGroup.add(cornice);
              }
            }
          }
        }

        // 左右封口端面与洞口内侧立面封口
        const capTopY = (style === 'classical') ? (height - 0.12) : height;
        addQuad(new THREE.Vector3(xMin, 0, -halfT), new THREE.Vector3(xMin, 0, halfT), new THREE.Vector3(xMin, capTopY, halfT), new THREE.Vector3(xMin, capTopY, -halfT));
        addQuad(new THREE.Vector3(xMax, 0, halfT), new THREE.Vector3(xMax, 0, -halfT), new THREE.Vector3(xMax, capTopY, -halfT), new THREE.Vector3(xMax, capTopY, halfT));

        for (const o of segOpenings) {
          const lx = Math.max(xMin, o.center - o.width * 0.5);
          const rx = Math.min(xMax, o.center + o.width * 0.5);
          const by = o.bottom, ty = Math.min(capTopY, o.bottom + o.height);
          addQuad(new THREE.Vector3(lx, by, halfT), new THREE.Vector3(lx, by, -halfT), new THREE.Vector3(lx, ty, -halfT), new THREE.Vector3(lx, ty, halfT));
          addQuad(new THREE.Vector3(rx, by, -halfT), new THREE.Vector3(rx, by, halfT), new THREE.Vector3(rx, ty, halfT), new THREE.Vector3(rx, ty, -halfT));
        }

        const wGeom = new THREE.BufferGeometry();
        wGeom.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        wGeom.setAttribute('normal', new THREE.Float32BufferAttribute(norm, 3));
        const wMesh = new THREE.Mesh(wGeom, wallMat);
        wMesh.castShadow = true;
        wMesh.receiveShadow = true;
        segGroup.add(wMesh);

        for (const o of segOpenings) {
          const compGroup = OpeningsKit.createOpeningMesh(o.type, o.width, o.height, o.bottom, o.rise || 0.4, thickness);
          if (compGroup) {
            compGroup.position.set(o.center, o.bottom, 0);
            segGroup.add(compGroup);
          }
        }

        const angle = -Math.atan2(dz, dx);
        segGroup.position.set(p0[0], segBaseY, p0[2]);
        segGroup.rotation.y = angle;
        pathGroup.add(segGroup);
      }

      // 节点立柱或无立柱时的转角连接柱 (确保转角无重叠且严丝合缝)
      const limit = wallObj.closed ? points3D.length - 1 : points3D.length;
      for (let i = 0; i < limit; i++) {
        const pt = points3D[i];
        const ptBaseY = (pt[1] !== undefined) ? pt[1] : baseY;
        if (hasPillars) {
          const pilW = thickness * 1.35;
          const pillar = new THREE.Mesh(MeshKit.createBoxGeometry(pilW, height + 0.06, pilW), MATERIALS.wood_dark);
          pillar.position.set(pt[0], ptBaseY + (height + 0.06) * 0.5, pt[2]);
          pillar.castShadow = true;
          pathGroup.add(pillar);
        } else if (wallObj.closed || (i > 0 && i < limit - 1)) {
          // 当关闭装饰立柱时，在转角处放置与墙同宽高的无重叠转角连接块
          const cornerH = (style === 'classical') ? (height - 0.12) : height;
          const cornerBlock = new THREE.Mesh(MeshKit.createBoxGeometry(thickness, cornerH, thickness), wallMat);
          cornerBlock.position.set(pt[0], ptBaseY + cornerH * 0.5, pt[2]);
          cornerBlock.castShadow = true;
          pathGroup.add(cornerBlock);
          if (style === 'classical') {
            const cornerCap = new THREE.Mesh(MeshKit.createBoxGeometry(thickness + 0.06, 0.12, thickness + 0.06), MATERIALS.wood_dark);
            cornerCap.position.set(pt[0], ptBaseY + height - 0.06, pt[2]);
            pathGroup.add(cornerCap);
          }
        }
      }
    }

    const OpeningsKit = {
      createOpeningMesh: function(type, width, height, bottom, rise = 0.4, wallThick = 0.28) {
        const root = new THREE.Group();
        const frameThick = wallThick + 0.05, frameW = Math.min(0.12, width * 0.10);

        if (type === 'arched_window') {
          // 1. 宽凸石质窗台与基座裙板 (Sill & Apron)
          const sill = new THREE.Mesh(MeshKit.createBoxGeometry(width + 0.22, 0.09, frameThick + 0.12), MATERIALS.stone);
          sill.position.set(0, 0.045, 0); root.add(sill);
          const apron = new THREE.Mesh(MeshKit.createBoxGeometry(width + 0.14, 0.07, frameThick + 0.04), MATERIALS.wood_dark);
          apron.position.set(0, -0.035, 0); root.add(apron);

          // 2. 左右侧立柱 (Jambs) 与拱脚水平过梁
          const springY = height - rise;
          const jambL = new THREE.Mesh(MeshKit.createBoxGeometry(frameW, springY, frameThick), MATERIALS.wood_dark);
          jambL.position.set(-width * 0.5 + frameW * 0.5, springY * 0.5, 0); root.add(jambL);
          const jambR = new THREE.Mesh(MeshKit.createBoxGeometry(frameW, springY, frameThick), MATERIALS.wood_dark);
          jambR.position.set(width * 0.5 - frameW * 0.5, springY * 0.5, 0); root.add(jambR);

          // 3. 多段面拱圈结构 (Faceted Arch Band)
          const archSegs = 14, r = (width - frameW * 2) * 0.5;
          const arcPts = [];
          for (let i = 0; i <= archSegs; i++) {
            const th = Math.PI * (i / archSegs);
            arcPts.push([-Math.cos(th) * r, springY + Math.sin(th) * (rise - frameW * 0.5)]);
          }
          for (let i = 0; i < archSegs; i++) {
            const pA = arcPts[i], pB = arcPts[i + 1];
            const segLen = Math.hypot(pB[0] - pA[0], pB[1] - pA[1]) + 0.015;
            const seg = new THREE.Mesh(MeshKit.createBoxGeometry(segLen, frameW * 0.9, frameThick * 0.95), MATERIALS.wood_dark);
            seg.position.set((pA[0] + pB[0]) * 0.5, (pA[1] + pB[1]) * 0.5, 0);
            seg.rotation.z = Math.atan2(pB[1] - pA[1], pB[0] - pA[0]);
            root.add(seg);
          }

          // 4. 拱心石辐射状扇形木棂 (Fan rays)
          for (let j = 1; j <= 3; j++) {
            const th = Math.PI * (j / 4);
            const targetX = r * Math.cos(th), targetY = springY + (rise - frameW) * Math.sin(th);
            const rayLen = Math.hypot(targetX, targetY - springY);
            const ray = new THREE.Mesh(MeshKit.createBoxGeometry(rayLen, 0.03, 0.035), MATERIALS.wood);
            ray.position.set(targetX * 0.5, springY + (targetY - springY) * 0.5, 0);
            ray.rotation.z = Math.atan2(targetY - springY, targetX);
            root.add(ray);
          }

          // 5. 下半部纵横直交窗棂与腰线 (Mullions & Transoms)
          const mullV1 = new THREE.Mesh(MeshKit.createBoxGeometry(0.035, springY, 0.035), MATERIALS.wood);
          mullV1.position.set(-width * 0.18, springY * 0.5, 0); root.add(mullV1);
          const mullV2 = new THREE.Mesh(MeshKit.createBoxGeometry(0.035, springY, 0.035), MATERIALS.wood);
          mullV2.position.set(width * 0.18, springY * 0.5, 0); root.add(mullV2);
          const transom1 = new THREE.Mesh(MeshKit.createBoxGeometry(width - frameW * 2, 0.04, 0.04), MATERIALS.wood);
          transom1.position.set(0, springY * 0.5, 0); root.add(transom1);
          const springTransom = new THREE.Mesh(MeshKit.createBoxGeometry(width - frameW * 2, 0.05, frameThick * 0.6), MATERIALS.wood_dark);
          springTransom.position.set(0, springY, 0); root.add(springTransom);

          // 6. 玻璃透光面 (Glazing Plane)
          const glass = new THREE.Mesh(MeshKit.createBoxGeometry(width - frameW * 2, height - frameW, 0.015), MATERIALS.glass);
          glass.position.set(0, height * 0.5, 0); root.add(glass);

        } else if (type === 'rectangular_window') {
          // 矩形开窗：石质窗台、四周深边框与双十字窗棂
          const sill = new THREE.Mesh(MeshKit.createBoxGeometry(width + 0.18, 0.08, frameThick + 0.08), MATERIALS.stone);
          sill.position.set(0, 0.04, 0); root.add(sill);
          const top = new THREE.Mesh(MeshKit.createBoxGeometry(width - frameW * 2, frameW, frameThick), MATERIALS.wood_dark);
          top.position.set(0, height - frameW * 0.5, 0); root.add(top);
          const jambL = new THREE.Mesh(MeshKit.createBoxGeometry(frameW, height - 0.08, frameThick), MATERIALS.wood_dark);
          jambL.position.set(-width * 0.5 + frameW * 0.5, (height + 0.08) * 0.5, 0); root.add(jambL);
          const jambR = new THREE.Mesh(MeshKit.createBoxGeometry(frameW, height - 0.08, frameThick), MATERIALS.wood_dark);
          jambR.position.set(width * 0.5 - frameW * 0.5, (height + 0.08) * 0.5, 0); root.add(jambR);

          const glass = new THREE.Mesh(MeshKit.createBoxGeometry(width - frameW * 2, height - frameW * 2 - 0.08, 0.015), MATERIALS.glass);
          glass.position.set(0, (height + 0.08) * 0.5, 0); root.add(glass);

          const mullV = new THREE.Mesh(MeshKit.createBoxGeometry(0.035, height - frameW * 2 - 0.08, 0.035), MATERIALS.wood);
          mullV.position.set(0, (height + 0.08) * 0.5, 0); root.add(mullV);
          const mullH = new THREE.Mesh(MeshKit.createBoxGeometry(width - frameW * 2, 0.035, 0.035), MATERIALS.wood);
          mullH.position.set(0, (height + 0.08) * 0.5, 0); root.add(mullH);

        } else if (type === 'round_window') {
          const r = Math.min(width, height) * 0.46;
          const segs = 16;
          for (let i = 0; i < segs; i++) {
            const a0 = (i / segs) * Math.PI * 2, a1 = ((i + 1) / segs) * Math.PI * 2;
            const pA = [Math.cos(a0) * r, Math.sin(a0) * r], pB = [Math.cos(a1) * r, Math.sin(a1) * r];
            const seg = new THREE.Mesh(MeshKit.createBoxGeometry(frameW, 0.06, frameThick), MATERIALS.wood_dark);
            seg.position.set((pA[0] + pB[0]) * 0.5, height * 0.5 + (pA[1] + pB[1]) * 0.5, 0);
            seg.rotation.z = Math.atan2(pB[1] - pA[1], pB[0] - pA[0]);
            root.add(seg);
          }
          const glass = new THREE.Mesh(MeshKit.createBoxGeometry(r * 1.85, r * 1.85, 0.015), MATERIALS.glass);
          glass.position.set(0, height * 0.5, 0); root.add(glass);
          const mullH = new THREE.Mesh(MeshKit.createBoxGeometry(r * 1.9, 0.03, 0.03), MATERIALS.wood);
          mullH.position.set(0, height * 0.5, 0); root.add(mullH);
          const mullV = new THREE.Mesh(MeshKit.createBoxGeometry(0.03, r * 1.9, 0.03), MATERIALS.wood);
          mullV.position.set(0, height * 0.5, 0); root.add(mullV);

        } else if (type === 'closed_door' || type === 'arched_closed_door') {
          // 纯正古典护墙单开门：门套、上部门楣与顶冠 (Cornice)、凹凸立体门板与黄铜门把手
          const headerH = frameW * 1.25;
          const jambL = new THREE.Mesh(MeshKit.createBoxGeometry(frameW, height, frameThick + 0.02), MATERIALS.wood_dark);
          jambL.position.set(-width * 0.5 + frameW * 0.5, height * 0.5, 0); root.add(jambL);
          const jambR = new THREE.Mesh(MeshKit.createBoxGeometry(frameW, height, frameThick + 0.02), MATERIALS.wood_dark);
          jambR.position.set(width * 0.5 - frameW * 0.5, height * 0.5, 0); root.add(jambR);

          const lintel = new THREE.Mesh(MeshKit.createBoxGeometry(width + 0.14, headerH, frameThick + 0.04), MATERIALS.wood_dark);
          lintel.position.set(0, height + headerH * 0.5, 0); root.add(lintel);
          const cornice = new THREE.Mesh(MeshKit.createBoxGeometry(width + 0.22, 0.08, frameThick + 0.08), MATERIALS.wood);
          cornice.position.set(0, height + headerH + 0.04, 0); root.add(cornice);

          // 门扇本体 (Door Leaf)
          const leafW = width - frameW * 2 - 0.02;
          const leafH = height - 0.02;
          const leaf = new THREE.Mesh(MeshKit.createBoxGeometry(leafW, leafH, 0.06), MATERIALS.wood);
          leaf.position.set(0, leafH * 0.5 + 0.01, 0); root.add(leaf);

          // 上下两组凹凸立体实木浮雕面板 (Raised Panels)
          const panelW = leafW * 0.72;
          const lowerH = leafH * 0.35, upperH = leafH * 0.45;
          const panelL = new THREE.Mesh(MeshKit.createBoxGeometry(panelW, lowerH, 0.085), MATERIALS.wood_dark);
          panelL.position.set(0, 0.12 + lowerH * 0.5, 0); root.add(panelL);
          const panelU = new THREE.Mesh(MeshKit.createBoxGeometry(panelW, upperH, 0.085), MATERIALS.wood_dark);
          panelU.position.set(0, leafH - 0.08 - upperH * 0.5, 0); root.add(panelU);

          // 黄铜锁面板、圆把手与锁孔 (Brass Lever Handle & Escutcheon)
          const hPlate = new THREE.Mesh(MeshKit.createBoxGeometry(0.045, 0.18, 0.095), MATERIALS.gold);
          hPlate.position.set(width * 0.32, 1.05, 0); root.add(hPlate);
          const hLever = new THREE.Mesh(MeshKit.createBoxGeometry(0.12, 0.022, 0.11), MATERIALS.gold);
          hLever.position.set(width * 0.32 - 0.04, 1.07, 0.01); root.add(hLever);

        } else if (type === 'double_door') {
          // 双开古典大门
          const headerH = frameW * 1.35;
          const jambL = new THREE.Mesh(MeshKit.createBoxGeometry(frameW, height, frameThick + 0.03), MATERIALS.wood_dark);
          jambL.position.set(-width * 0.5 + frameW * 0.5, height * 0.5, 0); root.add(jambL);
          const jambR = new THREE.Mesh(MeshKit.createBoxGeometry(frameW, height, frameThick + 0.03), MATERIALS.wood_dark);
          jambR.position.set(width * 0.5 - frameW * 0.5, height * 0.5, 0); root.add(jambR);

          const lintel = new THREE.Mesh(MeshKit.createBoxGeometry(width + 0.18, headerH, frameThick + 0.06), MATERIALS.wood_dark);
          lintel.position.set(0, height + headerH * 0.5, 0); root.add(lintel);
          const cornice = new THREE.Mesh(MeshKit.createBoxGeometry(width + 0.28, 0.10, frameThick + 0.10), MATERIALS.wood);
          cornice.position.set(0, height + headerH + 0.05, 0); root.add(cornice);

          const singleW = (width - frameW * 2 - 0.04) * 0.5;
          const leafH = height - 0.02;

          for (const sign of [-1, 1]) {
            const cx = sign * (singleW * 0.5 + 0.01);
            const leaf = new THREE.Mesh(MeshKit.createBoxGeometry(singleW, leafH, 0.06), MATERIALS.wood);
            leaf.position.set(cx, leafH * 0.5 + 0.01, 0); root.add(leaf);

            const pW = singleW * 0.72;
            const lowerH = leafH * 0.35, upperH = leafH * 0.45;
            const pL = new THREE.Mesh(MeshKit.createBoxGeometry(pW, lowerH, 0.085), MATERIALS.wood_dark);
            pL.position.set(cx, 0.12 + lowerH * 0.5, 0); root.add(pL);
            const pU = new THREE.Mesh(MeshKit.createBoxGeometry(pW, upperH, 0.085), MATERIALS.wood_dark);
            pU.position.set(cx, leafH - 0.08 - upperH * 0.5, 0); root.add(pU);

            const hPlate = new THREE.Mesh(MeshKit.createBoxGeometry(0.04, 0.18, 0.095), MATERIALS.gold);
            hPlate.position.set(sign * 0.06, 1.05, 0); root.add(hPlate);
            const hLever = new THREE.Mesh(MeshKit.createBoxGeometry(0.10, 0.022, 0.11), MATERIALS.gold);
            hLever.position.set(sign * 0.06 - sign * 0.03, 1.07, 0.01); root.add(hLever);
          }

        } else if (type === 'portal_arch') {
          const headerH = frameW * 1.4;
          const jambL = new THREE.Mesh(MeshKit.createBoxGeometry(frameW * 1.2, height, frameThick * 1.1), MATERIALS.wood_dark);
          jambL.position.set(-width * 0.5 + frameW * 0.6, height * 0.5, 0); root.add(jambL);
          const jambR = new THREE.Mesh(MeshKit.createBoxGeometry(frameW * 1.2, height, frameThick * 1.1), MATERIALS.wood_dark);
          jambR.position.set(width * 0.5 - frameW * 0.6, height * 0.5, 0); root.add(jambR);
          const header = new THREE.Mesh(MeshKit.createBoxGeometry(width + 0.16, headerH, frameThick * 1.15), MATERIALS.wood_dark);
          header.position.set(0, height + headerH * 0.5, 0); root.add(header);
        }
        return root;
      }
    };

    function buildSingleStair3D(s) {
      const root = new THREE.Group();
      prop3DGroup.add(root);
      root.position.set(s.x, s.y || 0, s.z);
      root.rotation.y = (s.yaw || 0) * Math.PI / 180;

      const rH = s.rise / s.risers, tD = s.run / s.risers, nosing = s.nosing || 0.03;
      for (let i = 0; i < s.risers; i++) {
        const tread = new THREE.Mesh(MeshKit.createBoxGeometry(tD + nosing, 0.045, s.width), MATERIALS.wood);
        tread.position.set(i * tD + (tD + nosing) * 0.5 - nosing, (i + 1) * rH - 0.022, 0);
        tread.castShadow = true;
        root.add(tread);

        const riser = new THREE.Mesh(MeshKit.createBoxGeometry(0.03, rH, s.width), MATERIALS.wood_dark);
        riser.position.set(i * tD, (i + 1) * rH - rH * 0.5, 0);
        riser.castShadow = true;
        root.add(riser);

        if (s.railingPos !== 'none') {
          const zSides = [];
          if (s.railingPos === 'both' || s.railingPos === 'left') zSides.push(-s.width * 0.5 + 0.05);
          if (s.railingPos === 'both' || s.railingPos === 'right') zSides.push(s.width * 0.5 - 0.05);
          for (const zSide of zSides) {
            const bal = new THREE.Mesh(MeshKit.createBoxGeometry(0.04, 0.75, 0.04), MATERIALS.wood_dark);
            bal.position.set(i * tD + tD * 0.5, (i + 1) * rH + 0.375, zSide);
            root.add(bal);
          }
        }
      }

      if (s.railingPos !== 'none') {
        const zSides = [];
        if (s.railingPos === 'both' || s.railingPos === 'left') zSides.push(-s.width * 0.5 + 0.05);
        if (s.railingPos === 'both' || s.railingPos === 'right') zSides.push(s.width * 0.5 - 0.05);
        for (const zSide of zSides) {
          const postStart = new THREE.Mesh(MeshKit.createBoxGeometry(0.09, 0.95, 0.09), MATERIALS.wood_dark);
          postStart.position.set(0, 0.475, zSide); root.add(postStart);
          const postEnd = new THREE.Mesh(MeshKit.createBoxGeometry(0.09, 0.95, 0.09), MATERIALS.wood_dark);
          postEnd.position.set(s.run, s.rise + 0.475, zSide); root.add(postEnd);
          const slopeLen = Math.hypot(s.run, s.rise);
          const handrail = new THREE.Mesh(MeshKit.createBoxGeometry(slopeLen, 0.06, 0.08), MATERIALS.wood_dark);
          handrail.position.set(s.run * 0.5, s.rise * 0.5 + 0.85, zSide);
          handrail.rotation.z = Math.atan2(s.rise, s.run);
          root.add(handrail);
        }
      }
    }

    function buildSingleRailing3D(railObj) {
      const { points: pts3D, height = 0.9, spacing = 0.18 } = railObj;
      const root = new THREE.Group();
      prop3DGroup.add(root);

      for (let i = 0; i < pts3D.length - 1; i++) {
        const p0 = pts3D[i], p1 = pts3D[i + 1];
        const dx = p1[0] - p0[0], dz = p1[2] - p0[2];
        const len = Math.hypot(dx, dz);
        if (len < 0.05) continue;

        const seg = new THREE.Group();
        const rail = new THREE.Mesh(MeshKit.createBoxGeometry(len, 0.06, 0.07), MATERIALS.wood_dark);
        rail.position.set(len * 0.5, height - 0.03, 0); seg.add(rail);
        const base = new THREE.Mesh(MeshKit.createBoxGeometry(len, 0.04, 0.06), MATERIALS.wood_dark);
        base.position.set(len * 0.5, 0.05, 0); seg.add(base);

        const count = Math.max(1, Math.floor(len / spacing));
        const realStep = len / count;
        for (let k = 1; k < count; k++) {
          const bal = new THREE.Mesh(MeshKit.createBoxGeometry(0.04, height - 0.12, 0.04), MATERIALS.wood);
          bal.position.set(k * realStep, height * 0.5, 0); seg.add(bal);
        }

        const newel = new THREE.Mesh(MeshKit.createBoxGeometry(0.09, height + 0.08, 0.09), MATERIALS.wood_dark);
        newel.position.set(0, (height + 0.08) * 0.5, 0); seg.add(newel);
        if (i === pts3D.length - 2) {
          const endNewel = new THREE.Mesh(MeshKit.createBoxGeometry(0.09, height + 0.08, 0.09), MATERIALS.wood_dark);
          endNewel.position.set(len, (height + 0.08) * 0.5, 0); seg.add(endNewel);
        }

        seg.position.set(p0[0], p0[1], p0[2]);
        seg.rotation.y = -Math.atan2(dz, dx);
        root.add(seg);
      }
    }

    function buildSingleProp3D(pObj) {
      const { kind: type, x: px, y: baseY = 0, z: pz, yaw = 0, params = {} } = pObj;
      const root = new THREE.Group();

      if (type === 'planter') {
        // 严格按照 Python kit/furniture.py planter & _leaf 还原：
        // 1. 八面体低多边形空心石质花盆 (Lathe profile with 8 sides)
        // 2. 八面体内嵌深色营养土层
        // 3. 10片放射状6顶点立体双向起脊叶片 (Solid 6-vertex closed blade with raised ridge & underside)
        // 4. 7朵带绿茎、奶油色花心、6瓣花瓣与黄色花蕊的低多边形花朵簇
        const pw = params.plant_w ?? params.width ?? 0.65;
        const ph = params.plant_h ?? params.height ?? 0.85;
        const flowerCount = params.flower_count ?? 7;
        const seed = params.seed ?? 7;

        let rngState = seed;
        const rng = () => { rngState = (rngState * 9301 + 49297) % 233280; return rngState / 233280; };
        const uniform = (min, max) => min + (max - min) * rng();

        const potH = ph * 0.44;
        const radius = pw * 0.31;

        // 1. 严格对应 kit/furniture.py 第 485-490 行的八面空心花盆 profile：
        const potProfile = [
          [radius * 0.60, 0],
          [radius * 0.67, potH * 0.07],
          [radius * 0.91, potH * 0.78],
          [radius * 0.94, potH * 0.84],
          [radius,        potH * 0.86],
          [radius,        potH],
          [radius * 0.82, potH],
          [radius * 0.78, potH * 0.81],
          [radius * 0.56, potH * 0.17],
          [0,             potH * 0.17]
        ];
        const potGeom = MeshKit.createLatheGeometry(potProfile, 8, true);
        const potMesh = new THREE.Mesh(potGeom, MATERIALS.stone);
        potMesh.castShadow = true;
        potMesh.receiveShadow = true;
        root.add(potMesh);

        // 2. 严格对应 kit/furniture.py 第 491-492 行的八面体土壤层：
        const soilGeom = new THREE.CylinderGeometry(radius * 0.78, radius * 0.78, ph * 0.018, 8);
        const soilMesh = new THREE.Mesh(soilGeom, MATERIALS.wood_dark);
        soilMesh.position.y = potH * 0.86 + (ph * 0.018) * 0.5;
        root.add(soilMesh);

        // 3. 严格对应 kit/furniture.py 第 459-472 行 _leaf 的 6 顶点双向立体起脊叶片：
        for (let i = 0; i < 10; i++) {
          const theta = 2 * Math.PI * (i / 10) + uniform(-0.15, 0.15);
          const outer = pw * uniform(0.38, 0.48);
          const startX = Math.cos(theta) * pw * 0.05;
          const startZ = Math.sin(theta) * pw * 0.05;
          const startY = potH * 0.92;
          const endX = Math.cos(theta) * outer;
          const endZ = Math.sin(theta) * outer;
          const endY = ph * uniform(0.48, 0.68);
          const leafW = pw * uniform(0.15, 0.23);
          const leafMat = (i % 3 === 0) ? MATERIALS.green : MATERIALS.leaf;

          const dx = endX - startX, dz = endZ - startZ;
          const len = Math.hypot(dx, dz) || 1e-6;
          const tx = -dz / len, tz = dx / len;
          const cx = (startX + endX) * 0.5, cy = (startY + endY) * 0.5, cz = (startZ + endZ) * 0.5;

          const v0 = [startX, startY, startZ];
          const v1 = [endX, endY, endZ];
          const v2 = [cx + tx * leafW * 0.5, cy, cz + tz * leafW * 0.5];
          const v3 = [cx - tx * leafW * 0.5, cy, cz - tz * leafW * 0.5];
          const v4 = [cx, cy + leafW * 0.14, cz]; // 背脊凸起 (raised central ridge)
          const v5 = [cx, cy - leafW * 0.04, cz]; // 腹面微凹 (thin underside)

          const triIndices = [
            0, 2, 4,   2, 1, 4,   1, 3, 4,   3, 0, 4, // 凸脊 4 面
            2, 0, 5,   1, 2, 5,   3, 1, 5,   0, 3, 5  // 腹底 4 面
          ];
          const verts = [v0, v1, v2, v3, v4, v5];
          const positions = [];
          for (const idx of triIndices) {
            positions.push(...verts[idx]);
          }

          const leafGeom = new THREE.BufferGeometry();
          leafGeom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
          leafGeom.computeVertexNormals();
          const leafMesh = new THREE.Mesh(leafGeom, leafMat);
          root.add(leafMesh);
        }

        // 4. 严格对应 kit/furniture.py 第 501-528 行的花朵簇：
        const count = Math.max(0, Math.floor(flowerCount));
        for (let i = 0; i < count; i++) {
          let fx = 0, fz = 0, fy = ph * 0.89;
          if (i > 0) {
            const angle = 2 * Math.PI * (i - 1) / Math.max(1, count - 1) + 0.20;
            const rr = pw * (count <= 8 ? 0.23 : 0.29);
            fx = Math.cos(angle) * rr;
            fz = Math.sin(angle) * rr;
            fy = ph * (0.72 + 0.06 * Math.sin(angle * 2 + 0.4));
          }
          const flowerRadius = Math.min(pw * 0.115, ph * 0.09);

          // 斜向花茎 (Stem beam from (fx*0.35, potH*0.85, fz*0.35) to (fx, fy, fz))
          const pStart = new THREE.Vector3(fx * 0.35, potH * 0.85, fz * 0.35);
          const pEnd = new THREE.Vector3(fx, fy, fz);
          const stemDir = new THREE.Vector3().subVectors(pEnd, pStart);
          const stemLen = stemDir.length();
          const stemW = pw * 0.012;
          const stemGeom = new THREE.CylinderGeometry(stemW * 0.5, stemW * 0.5, stemLen, 6);
          const stemMesh = new THREE.Mesh(stemGeom, MATERIALS.leaf);
          stemMesh.position.copy(pStart).add(pEnd).multiplyScalar(0.5);
          stemMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), stemDir.clone().normalize());
          root.add(stemMesh);

          // 花心 (FlowerHeart: ico with radius*0.65, scale (1, 0.75, 1))
          const heartGeom = new THREE.IcosahedronGeometry(flowerRadius * 0.65, 1);
          heartGeom.scale(1, 0.75, 1);
          const heartMesh = new THREE.Mesh(heartGeom, MATERIALS.cream);
          heartMesh.position.set(fx, fy + flowerRadius * 0.15, fz);
          root.add(heartMesh);

          // 6片多边形花瓣 (6 Faceted Petals: radius*0.62, scale (1, 0.70, 1))
          for (let petal = 0; petal < 6; petal++) {
            const theta = petal * Math.PI / 3 + i * 0.37;
            const pr = flowerRadius * 0.65;
            const px = fx + Math.cos(theta) * pr;
            const pz = fz + Math.sin(theta) * pr;
            const py = fy + uniform(-0.05, 0.08) * flowerRadius;
            const petalGeom = new THREE.IcosahedronGeometry(flowerRadius * 0.62, 1);
            petalGeom.scale(1, 0.70, 1);
            const petalMesh = new THREE.Mesh(petalGeom, MATERIALS.cream);
            petalMesh.position.set(px, py, pz);
            root.add(petalMesh);
          }

          // 花粉核心 (Pollen: ico with radius*0.25, mats["wall"])
          const pollenGeom = new THREE.IcosahedronGeometry(flowerRadius * 0.25, 1);
          const pollenMesh = new THREE.Mesh(pollenGeom, MATERIALS.wall);
          pollenMesh.position.set(fx, fy + flowerRadius * 0.60, fz);
          root.add(pollenMesh);
        }

      } else if (type === 'pedestal') {
        // 阶梯式古典雕花展台 (Foot, Plinth, Shaft, Neck, Capital, Inset Panels)
        const pw = params.width ?? 0.52, ph = params.height ?? 0.75;
        const foot = new THREE.Mesh(MeshKit.createBoxGeometry(pw * 1.14, 0.12, pw * 1.14), MATERIALS.wood_light);
        foot.position.y = 0.06; root.add(foot);
        const plinth = new THREE.Mesh(MeshKit.createBoxGeometry(pw, 0.14, pw), MATERIALS.wood);
        plinth.position.y = 0.19; root.add(plinth);
        const shaft = new THREE.Mesh(MeshKit.createBoxGeometry(pw * 0.78, ph - 0.28, pw * 0.78), MATERIALS.wood);
        shaft.position.y = 0.26 + (ph - 0.28) * 0.5; root.add(shaft);
        // 侧面凹凸线脚
        const panelF = new THREE.Mesh(MeshKit.createBoxGeometry(pw * 0.48, (ph - 0.34) * 0.75, 0.02), MATERIALS.wood_dark);

        const sw = params.screen_w ?? 1.8, sh = params.screen_h ?? 1.7;
        const pW = sw / 3;
        for (let i = 0; i < 3; i++) {
          const px = -sw * 0.5 + pW * 0.5 + i * pW;
          const pz = (i === 1) ? -0.10 : 0.08;
          const frame = new THREE.Mesh(MeshKit.createBoxGeometry(pW - 0.02, sh, 0.03), MATERIALS.wood);
          frame.position.set(px, sh * 0.5, pz); root.add(frame);
          const fabric = new THREE.Mesh(MeshKit.createBoxGeometry(pW - 0.08, sh - 0.12, 0.01), MATERIALS.cream);
          fabric.position.set(px, sh * 0.5, pz); root.add(fabric);
        }

      } else if (type === 'crates') {
        // 板条木箱堆 (Crate Stack)
        const c1 = new THREE.Mesh(MeshKit.createBoxGeometry(0.70, 0.70, 0.70), MATERIALS.wood);
        c1.position.set(0, 0.35, 0); root.add(c1);
        const c2 = new THREE.Mesh(MeshKit.createBoxGeometry(0.55, 0.55, 0.55), MATERIALS.wood_light);
        c2.position.set(0.12, 0.70 + 0.275, -0.05); c2.rotation.y = 0.25; root.add(c2);

      } else {
        // 默认通用低多边形箱体
        const box = new THREE.Mesh(MeshKit.createBoxGeometry(0.6, 0.6, 0.6), MATERIALS.wood);
        box.position.y = 0.3; root.add(box);
      }

      root.traverse(child => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });
      root.position.set(px, baseY, pz);
      root.rotation.y = (yaw || 0) * Math.PI / 180;
      prop3DGroup.add(root);
      return root;
    }

    function setActiveTool(t) {
      activeTool = t;
      currentDrawingPoints = [];
      updateDrawingActionsUI();

      // 当切换到绘墙工具时，若勾选了“自动跟随图层标高”，自动将初始点位标高同步为当前图层标高
      const wallDrawBar = document.getElementById('wall-draw-bar');
      if (t === 'wall') {
        if (document.getElementById('wall-auto-layer-y')?.checked) {
          const l = getActiveLayer();
          if (l) syncLiveWallDrawParams('y', l.y);
        } else {
          syncLiveWallDrawParams('y', document.getElementById('wall-basey-val')?.value || 0);
        }
        syncLiveWallDrawParams('h', document.getElementById('wall-h-val')?.value || 3.6);
        syncLiveWallDrawParams('t', document.getElementById('wall-t-val')?.value || 0.28);
        if (wallDrawBar) { wallDrawBar.classList.remove('hidden'); wallDrawBar.classList.add('flex'); }
      } else {
        if (wallDrawBar) { wallDrawBar.classList.add('hidden'); wallDrawBar.classList.remove('flex'); }
      }

      const hintEl = document.getElementById('status-hint');
      if (hintEl) {
        const hints = {
          select: '左键选择/拖拽 · 双击构件或按 E 打开独立参数界面 · 双击线段插点 · 按 R 旋转',
          floor: '正在放线绘制地板：左键依次点击多边形顶点，点击起点或按 Enter 闭合完成',
          wall: '正在放线绘制墙体：可在顶部悬浮条实时修改点标高 Y / 墙高 / 墙厚，按 Enter 完成',
          opening: '门窗安装模式：将鼠标移至任意墙体线段上，左键点击即可开孔并装配门窗',
          railing: '正在放线绘制木栏杆：左键点击节点，按 Enter 生成车削栏杆',
          prop: '点选放置模式：在 2D 平面任意位置左键点击即可放置当前所选家具/灯具'
        };
        hintEl.innerText = hints[t] || hints.select;
      }

      const canvas = document.getElementById('canvas2d');
      if (canvas) {
        canvas.style.cursor = (t === 'select') ? 'default' : 'crosshair';
      }

    function updateDrawingActionsUI() {
      const box = document.getElementById('drawing-actions');
      if (!box) return;
      if (currentDrawingPoints.length > 0) {
        box.classList.remove('hidden');
        box.classList.add('flex');
      } else {
        box.classList.add('hidden');
        box.classList.remove('flex');
      }
    }

    function finishCurrentPath(close = true) {
      if (currentDrawingPoints.length < 2) return;
      const l = getActiveLayer();

      if (activeTool === 'floor') {
        if (currentDrawingPoints.length >= 3) {
          l.addPolygonWithClipping(currentDrawingPoints.map(p => [p[0], p[1]]));
          showToast('已生成独立地板多边形');
        }
      } else if (activeTool === 'wall') {
        const baseY = parseFloat(document.getElementById('wall-basey-val').value) || (l ? l.y : 0);
        const pts = currentDrawingPoints.map(p => [p[0], (p[2] !== undefined ? p[2] : baseY), p[1]]);
        const isClosed = close && currentDrawingPoints.length >= 3;
        if (isClosed) pts.push([...pts[0]]);
        wallPaths.push({
          id: uid('wall'),
          name: `墙体 #${wallPaths.length + 1}`,
          points: pts,
          closed: isClosed,
          height: parseFloat(document.getElementById('wall-h-val').value) || 3.6,
          thickness: parseFloat(document.getElementById('wall-t-val').value) || 0.28,
          baseY,
          style: document.getElementById('wall-style-select').value || 'classical',
          hasPillars: document.getElementById('wall-has-pillars')?.checked ?? true,
          openings: []
        });
        rebuildAll3D();
        showToast('已生成独立墙体');
      } else if (activeTool === 'railing') {
        const baseY = l ? l.y : 0;
        const pts = currentDrawingPoints.map(p => [p[0], baseY, p[1]]);
        railingsData.push({
          id: uid('rail'),
          name: `木栏杆 #${railingsData.length + 1}`,
          points: pts,
          height: parseFloat(document.getElementById('rail-height-val').value) || 0.9,
          spacing: parseFloat(document.getElementById('rail-spacing-val').value) || 0.18
        });
        rebuildAll3D();
        showToast('已生成独立木栏杆');
      }

      currentDrawingPoints = [];
      updateDrawingActionsUI();
      setActiveTool('select');
      updateSceneOutlineUI();
      saveHistorySnapshot();
    }

    function cancelCurrentPath() {
      currentDrawingPoints = [];
      updateDrawingActionsUI();
      setActiveTool('select');
    }

    function buildGodotTscn() {
      const n = value => Number.isFinite(Number(value)) ? Number(value).toFixed(4) : '0.0000';
      const vec3 = p => `Vector3(${n(p[0])}, ${n(p[1])}, ${n(p[2])})`;
      const lines = [
        '[gd_scene load_steps=2 format=3]',
        '',
        '[ext_resource type="Script" path="res://scenes/components/architecture/SmartWall3D.gd" id="1_wall"]',
        '',
        '[node name="ArchBuilderRoot" type="Node3D"]',
        '',
        '[node name="Floors" type="Node3D" parent="."]',
        '',
        '[node name="Walls" type="Node3D" parent="."]',
        '',
        '[node name="Props" type="Node3D" parent="."]'
      ];
      floorLayers.forEach((layer, li) => {
        lines.push('', `[node name="FloorLayer_${li}" type="Node3D" parent="Floors"]`);
        layer.polygons.forEach((polygon, pi) => {
          const pts = polygon.slice();
          if (pts.length > 3 && Math.hypot(pts[0][0] - pts.at(-1)[0], pts[0][1] - pts.at(-1)[1]) < 0.001) pts.pop();
          if (pts.length < 3 || Math.abs(MeshKit.signedArea2D(pts)) < 0.01) return;
          lines.push('', `[node name="Floor_${li}_${pi}" type="CSGPolygon3D" parent="Floors/FloorLayer_${li}"]`,
            `position = Vector3(0, ${n(layer.y)}, 0)`, `rotation = Vector3(${n(Math.PI / 2)}, 0, 0)`,
            `polygon = PackedVector2Array(${pts.flat().map(n).join(', ')})`,
            'depth = 0.14', 'use_collision = true');
        });
      });
      wallPaths.forEach((wall, wi) => {
        lines.push('', `[node name="WallPath_${wi}" type="Node3D" parent="Walls"]`,
          `metadata/style = ${JSON.stringify(wall.style || 'plain')}`);
        for (let i = 0; i < wall.points.length - 1; i++) {
          const start = wall.points[i], end = wall.points[i + 1];
          const length = Math.hypot(end[0] - start[0], end[2] - start[2]);
          if (length < 0.05) continue;
          lines.push('', `[node name="Wall_${wi}_${i}" type="Node3D" parent="Walls/WallPath_${wi}"]`,
            'script = ExtResource("1_wall")', 'grid_snap = 0.0',
            `start_point = ${vec3(start)}`, `end_point = ${vec3(end)}`,
            `wall_height = ${n(wall.height)}`, `wall_thickness = ${n(wall.thickness)}`);
          const cutouts = (wall.openings || []).filter(o => Number(o.segment) === i).map(o => {
            const from = Math.max(0, Number(o.center) - Number(o.width) / 2);
            const to = Math.min(length, Number(o.center) + Number(o.width) / 2);
            const bottom = Math.max(0, Number(o.bottom));
            const top = Math.min(Number(wall.height), bottom + Number(o.height));
            return Number.isFinite(from + to + bottom + top) && to > from && top > bottom
              ? `{ "from": ${n(from)}, "to": ${n(to)}, "bottom": ${n(bottom)}, "top": ${n(top)} }` : null;
          }).filter(Boolean);
          if (cutouts.length) lines.push(`openings = Array[Dictionary]([${cutouts.join(', ')}])`);
        }
      });
      // Non-published web props keep their transform and ID for explicit binding.
      propsData.forEach((prop, pi) => {
        const kind = String(prop.kind || 'prop').replace(/[^a-zA-Z0-9_-]/g, '_');
        lines.push('', `[node name="${kind}_${pi}" type="Node3D" parent="Props"]`,
          `position = ${vec3([prop.x, prop.y || 0, prop.z])}`,
          `rotation = Vector3(0, ${n((prop.yaw || 0) * Math.PI / 180)}, 0)`,
          `metadata/source_kind = ${JSON.stringify(prop.kind || 'prop')}`);
      });
      return lines.join('\n') + '\n';
    }

    function exportGodotTscn() {
      const blob = new Blob([buildGodotTscn()], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'archbuilder_scene.tscn';
      a.click();
      showToast('已导出可编辑墙体、带碰撞的地板与洞口；道具仍为待发布候选');
    }

      closeClearSceneModal();
      while (floor3DGroup.children.length > 0) floor3DGroup.remove(floor3DGroup.children[0]);
      floorLayers = [];
      wallPaths = [];
      stairsData = [];
      railingsData = [];
      propsData = [];
      selectedItem = null;

      const baseLayer = createNewLayerUI('1F 展厅地板', 0.0);
      // 1. 独立内层地板多边形 (X: 0.4 ~ 7.6m, Z: 0.4 ~ 5.6m)
      baseLayer.addPolygonWithClipping([[0.4, 0.4], [0.4, 5.6], [7.6, 5.6], [7.6, 0.4]]);

      // 2. 沿地板外侧外扩 0.40m 生成完全分离的独立外墙环 (X: 0.0 ~ 8.0m, Z: 0.0 ~ 6.0m)
      document.getElementById('wall-outset-val').value = '0.40';
      autoBuildWallFromActiveFloor(true);

      // 3. 摆放默认室内陈设 (台灯带 mount_y: 0.75m 精确置于书桌桌面)
      spawnPropPreset('table', 4.0, 3.2, 0);
      spawnPropPreset('chair', 4.0, 2.3, 0);
      spawnPropPreset('bookshelf', 1.6, 5.2, 180);
      spawnPropPreset('banker_lamp', 4.45, 3.2, -20, { lamp_energy: 8, mount_y: 0.75 });
      spawnPropPreset('wall_lantern', 0.2, 3.0, 0, { lamp_energy: 15, lamp_height: 2.2 });

      rebuildAll3D();
      updateInspectorUI();
      updateSceneOutlineUI();
      saveHistorySnapshot();
    }

    function initPresetRoomsUI() {
      const select = document.getElementById('preset-rooms-selector');
      if (!select) return;
      select.innerHTML = '<option value="" disabled selected>选择已生成房间切换 (' + PRESET_ROOMS_CATALOG.length + '个)...</option>';
      PRESET_ROOMS_CATALOG.forEach(r => {
        const opt = document.createElement('option');
        opt.value = r.id;
        opt.textContent = `[${r.floor || '1F'}] ${r.name || r.id}`;
        opt.className = 'bg-[#13161c] text-white';
        select.appendChild(opt);
      });
    }

    function onPresetRoomSelected(roomId) {
      if (!roomId) return;
      const roomData = PRESET_ROOMS_CATALOG.find(r => r.id === roomId);
      if (roomData) {
        restoreSceneState(roomData);
        saveHistorySnapshot();
        reset2DView();
        reset3DCamera();
        render3DNow();
        showToast(`已成功载入房间: ${roomData.name || roomData.id}`);
      }
    }

    function importSceneFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          restoreSceneState(e.target.result);
          saveHistorySnapshot();
          reset2DView();
          reset3DCamera();
          render3DNow();
          showToast(`成功导入配置文件: ${file.name}`);
        } catch (err) {
          showToast('配置文件解析失败: ' + err.message);
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function exportSceneYaml() {
      if (typeof jsyaml === 'undefined') {
        showToast('YAML 序列化器未就绪');
        return;
      }
      const rawState = JSON.parse(serializeSceneState());
      const yamlStr = jsyaml.dump(rawState, { indent: 2, lineWidth: -1 });
      const blob = new Blob([yamlStr], { type: 'text/yaml;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${rawState.id || 'archbuilder_scene'}.yaml`;
      a.click();
      showToast('已导出标准 YAML 场景配置文件');
    }

    window.onload = () => {
      initPresetRoomsUI();
      lucide.createIcons();
      init2DCanvas();
      init3DScene();
      onPropKindChanged('wall_lantern');
      const select = document.getElementById('preset-rooms-selector');
      if (select && typeof PRESET_ROOMS_CATALOG !== 'undefined' && PRESET_ROOMS_CATALOG.length > 0) {
        select.value = 'R01';
        onPresetRoomSelected('R01');
      } else {
        resetToDefaultDemoScene();
      }
      reset2DView();
      reset3DCamera();
      onWindowResize3D();
      render3DNow();
    };
  </script>
